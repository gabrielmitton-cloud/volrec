name: term
# TEMPORARY. Verifies the far-leg columns against the live API at full scale.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  term:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Live far-leg check
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: |
          python - <<'PY'
          import atexit, csv, hashlib, os, sys, time
          from datetime import date
          from pathlib import Path
          import record as m
          _S=os.environ.get("GITHUB_STEP_SUMMARY")
          if _S:
              _sf=open(_S,"a",buffering=1);_sf.write("```text\n")
              class _T:
                  def __init__(s,*f):s.f=f
                  def write(s,x):
                      for g in s.f:g.write(x)
                      return len(x)
                  def flush(s):
                      for g in s.f:g.flush()
              sys.stdout=_T(sys.__stdout__,_sf)
              @atexit.register
              def _c():
                  try:_sf.write("\n```\n");_sf.flush()
                  except Exception:pass

          FAILS=[]
          REAL=Path("data/iv_history.csv"); MD5=hashlib.md5(REAL.read_bytes()).hexdigest()
          with REAL.open(newline="") as f: OH=next(csv.reader(f))
          with REAL.open(newline="") as f: OR_=list(csv.DictReader(f))
          tmp=Path("/tmp/l32/data"); tmp.mkdir(parents=True,exist_ok=True)
          COPY=tmp/"iv_history.csv"; COPY.write_bytes(REAL.read_bytes()); m.OUT=COPY
          print(f"REAL md5 {MD5}  ({len(OH)} cols x {len(OR_)} rows)   FIELDS now {len(m.FIELDS)}\n")

          s=m.session(); CODES={}
          _g=s.get
          def cg(*a,**kw):
              r=_g(*a,**kw);CODES[r.status_code]=CODES.get(r.status_code,0)+1;return r
          s.get=cg
          today=date.today()
          t0=time.perf_counter()
          spots=m.spot_prices(s,m.WATCHLIST)
          rows,failed=[],{}
          for sym in m.WATCHLIST:
              try:
                  if sym not in spots: raise RuntimeError("no price")
                  rows.append(m.snapshot(s,sym,spots[sym],today))
              except Exception as e: failed[sym]=f"{type(e).__name__}: {e}"
              time.sleep(m.PACE)
          el=time.perf_counter()-t0

          withfar=[r for r in rows if r.get("far_iv") is not None]
          nofar=[r for r in rows if r.get("far_iv") is None]
          print("="*74); print("FAR LEG COVERAGE"); print("="*74)
          print(f"  elapsed {el:.1f}s   HTTP {dict(sorted(CODES.items()))}   429s {CODES.get(429,0)}")
          print(f"  requests {sum(CODES.values())}  (was 219 before this change - must be unchanged)")
          print(f"  rows {len(rows)}/{len(m.WATCHLIST)}   far leg present {len(withfar)}/{len(rows)}"
                f"  = {100*len(withfar)/max(len(rows),1):.0f}%")
          print(f"  no far leg ({len(nofar)}): {', '.join(sorted(r['symbol'] for r in nofar)) or 'none'}")
          if CODES.get(429,0): FAILS.append("429s")
          if sum(CODES.values())>230: FAILS.append(f"{sum(CODES.values())} requests - the far leg should cost none")

          print("\n"+"="*74); print("TERM STRUCTURE SLOPE  (far_iv - iv, volatility points)"); print("="*74)
          sl=sorted((((r["far_iv"]-r["iv"])*100, r) for r in withfar if r.get("iv") is not None),
                    key=lambda t: t[0])   # key= or tied slopes make Python compare dicts
          print(f"  n={len(sl)}   most inverted -> most upward sloping")
          for v,r in sl[:8]:
              print(f"    {r['symbol']:6s} {r['dte']:>2}d {r['iv']*100:6.2f}%  ->  {r['far_dte']:>2}d {r['far_iv']*100:6.2f}%   {v:+6.2f}pt")
          print("    ...")
          for v,r in sl[-8:]:
              print(f"    {r['symbol']:6s} {r['dte']:>2}d {r['iv']*100:6.2f}%  ->  {r['far_dte']:>2}d {r['far_iv']*100:6.2f}%   {v:+6.2f}pt")
          import statistics as st
          vals=[v for v,_ in sl]
          print(f"\n  median {st.median(vals):+.2f}pt   mean {st.mean(vals):+.2f}pt   "
                f"range {min(vals):+.2f} to {max(vals):+.2f}")
          print(f"  inverted (near > far): {sum(1 for v in vals if v<0)}/{len(vals)}")
          if len(withfar) < 0.6*len(rows): FAILS.append(f"only {len(withfar)}/{len(rows)} have a far leg")

          print("\n"+"="*74); print("SANITY: far leg must differ from the near leg"); print("="*74)
          same=[r["symbol"] for r in withfar if r["far_symbol"]==r["option_symbol"]]
          sameexp=[r["symbol"] for r in withfar if r["far_expiration"]==r["expiration"]]
          print(f"  far_symbol == option_symbol: {len(same)}  (must be 0)")
          print(f"  far_expiration == expiration: {len(sameexp)}  (must be 0)")
          if same or sameexp: FAILS.append("far leg duplicates the near leg")
          oob=[r["symbol"] for r in withfar if not (m.DTE_WINDOW[0]<=r["far_dte"]<=m.DTE_WINDOW[1])]
          print(f"  far_dte outside {m.DTE_WINDOW}: {len(oob)}  (must be 0)")
          if oob: FAILS.append(f"far_dte out of window: {oob[:5]}")

          print("\n"+"="*74); print("MIGRATION 17 -> 32 ON A COPY"); print("="*74)
          m.append(rows)
          with COPY.open(newline="") as f: NH=next(csv.reader(f))
          with COPY.open(newline="") as f: AF=list(csv.DictReader(f))
          bad=sum(1 for i,o in enumerate(OR_) for k in OH if AF[i].get(k)!=o[k])
          print(f"  header {len(OH)} -> {len(NH)};  original cells preserved {len(OR_)*len(OH)-bad}/{len(OR_)*len(OH)}")
          print(f"  rows {len(OR_)} + {len(rows)} = {len(AF)}")
          if bad: FAILS.append(f"{bad} original cells changed")
          if NH!=m.FIELDS or NH[:17]!=OH: FAILS.append("header wrong after migration")

          after=hashlib.md5(REAL.read_bytes()).hexdigest()
          print(f"\n  real md5 before {MD5}\n  real md5 after  {after}")
          if after!=MD5: FAILS.append("REAL DATASET MODIFIED")
          else: print("  real dataset UNCHANGED")
          assert after==MD5
          print("\n"+"="*74)
          if FAILS:
              print("FAILURES:"); [print("  -",f) for f in FAILS]; sys.exit(1)
          print("ALL LIVE CHECKS PASSED")
          PY
