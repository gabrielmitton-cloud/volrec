name: surface
on:
  schedule:
    - cron: "57 14 * * 1-5"    # 10 min after record.yml, to avoid a rate-limit
                               # collision. Both are delayed by GitHub anyway;
                               # the stagger is belt and braces, not a guarantee.
                               # See record.yml for why 14:xx and not 15:xx, and
                               # why an odd minute. pressure_test.py enforces the
                               # 10-minute gap rather than the literal time, so
                               # moving one of these moves both or fails loudly.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python surface.py
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - name: Refuse to proceed if the ATM panel was touched
        run: |
          git diff --exit-code -- data/iv_history.csv data/iv_history.pre-17col.csv
      - name: Commit only the surface files
        run: |
          # On a market holiday the calendar guard writes nothing, so the file
          # may legitimately not exist. `git add` on a missing path exits 128,
          # which would turn every holiday into a failed run.
          if [ ! -f data/surface.csv ]; then
            echo "no surface file today (weekend, holiday, or first run) - nothing to commit"
            exit 0
          fi
          git config user.name "recorder"
          git config user.email "recorder@users.noreply.github.com"
          git add data/surface.csv
          # The wide file is additive and may legitimately not exist - first run,
          # or a day where no symbol needed widening. `git add` on a missing path
          # exits 128, which would fail this step and lose surface.csv with it.
          # An explicit if, never `[ -f ] && git add`, so the step cannot inherit
          # a non-zero status from a file that simply is not there.
          if [ -f data/surface_wide.csv ]; then git add data/surface_wide.csv; fi
          git diff --staged --quiet && exit 0
          git commit -m "surface $(date +%F)"
          # record.yml may be committing at the same time. Rebase and retry
          # rather than failing: the two jobs touch different files, so a
          # rebase resolves cleanly.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 10
          done
          exit 1
