name: surfacetest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  surfacetest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Probe the surface recorder (bypassing the weekend guard)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: |
          python - <<'PY' 2>&1 | tee /tmp/o.txt
          # Quotes are stale on a weekend. That is fine: this test is about
          # plumbing - row counts, columns, whether volume and greeks populate -
          # not about data quality.
          import record as R, surface, time
          from datetime import date, timedelta
          today = date.today()
          while today.weekday() >= 5:          # step back to the last weekday
              today -= timedelta(days=1)
          print(f"probing as of {today} ({today.strftime('%A')})\n")
          s = R.session()
          spots = R.spot_prices(s, surface.SURFACE)
          allrows, tot = [], 0
          for sym in surface.SURFACE:
              try:
                  r = surface.rows_for(s, sym, spots[sym], today)
                  allrows += r
                  vols = [int(x["volume"]) for x in r if str(x["volume"]).isdigit()]
                  ivs  = sum(1 for x in r if x["iv"] not in ("", None))
                  grk  = sum(1 for x in r if x["delta"] not in ("", None))
                  bid  = sum(1 for x in r if x["bid"] not in ("", None))
                  ks   = [float(x["strike"]) for x in r]
                  print(f"  {sym:5s} spot {spots[sym]:>8.2f} | {len(r):>3d} rows | "
                        f"exp {r[0]['expiration']} dte {r[0]['dte']:>2s} | "
                        f"iv {ivs:>3d} greeks {grk:>3d} quotes {bid:>3d} | "
                        f"vol>0 {sum(1 for v in vols if v>0):>3d} tot {sum(vols):>8,} | "
                        f"K {min(ks):.0f}-{max(ks):.0f}")
              except Exception as e:
                  print(f"  {sym:5s} FAILED: {type(e).__name__}: {e}")
              time.sleep(1.0)
          import csv, io
          buf = io.StringIO()
          w = csv.DictWriter(buf, fieldnames=surface.FIELDS); w.writeheader(); w.writerows(allrows)
          n = len(buf.getvalue().encode())
          print(f"\n=== SIZING ===")
          print(f"rows/day {len(allrows)}   bytes/day {n:,}   "
                f"per year (252d) {n*252/1e6:.1f} MB")
          if allrows:
              print("\nsample row:")
              for k, v in allrows[0].items(): print(f"  {k:14s} {v}")
          PY
          cat /tmp/o.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Assert the real dataset was untouched
        run: |
          echo "75035d11b530681571dbeb3294af5926  data/iv_history.pre-17col.csv" > /tmp/s
          md5sum -c /tmp/s
          git diff --exit-code -- data/ && echo "data/ clean"
