name: screen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: End-to-end sample through the real record.py code path
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: |
          python - <<'PY'
          import importlib.util, datetime, csv, io
          spec = importlib.util.spec_from_file_location("rec", "record.py")
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)

          print(f"WATCHLIST={len(m.WATCHLIST)}  FIELDS={len(m.FIELDS)}  PACE={m.PACE}")
          hdr = csv.DictReader(open("data/iv_history.csv", newline="")).fieldnames
          print(f"FIELDS match CSV header: {m.FIELDS == hdr}")
          print()

          s = m.session()
          today = datetime.date.today()
          print(f"is_trading_day({today}) = {m.is_trading_day(s, today)}  (Saturday -> expect False)")
          print()

          # sample across the old and NEW tickers, through the real snapshot()
          sample = ["SPY","MSTR",  "ORCL","IBIT","LQD","MARA","SMH","GDX","TSM","RIVN","DUK","C"]
          spots = m.spot_prices(s, sample)
          print(f"{'SYM':6s} {'SPOT':>9s} {'DTE':>4s} {'STRIKE':>9s} {'MNY':>7s} {'IV':>8s} {'DELTA':>7s} {'BID/ASK':>14s}  STATUS")
          print("-"*88)
          ok = fail = 0
          for sym in sample:
              try:
                  if sym not in spots: raise RuntimeError("no price")
                  r = m.snapshot(s, sym, spots[sym], today)
                  missing = [k for k in m.FIELDS if r.get(k) is None]
                  status = "OK" if not missing else "NULLS: " + ",".join(missing)
                  if not missing: ok += 1
                  else: fail += 1
                  print(f"{sym:6s} {r['spot']:9.2f} {r['dte']:4d} {r['strike']:9.2f} "
                        f"{r['moneyness']:7.4f} {r['iv']:8.4f} {r['delta']:7.4f} "
                        f"{str(r['bid'])+'/'+str(r['ask']):>14s}  {status}")
              except Exception as e:
                  fail += 1
                  print(f"{sym:6s} {'-':>9s} {'-':>4s} {'-':>9s} {'-':>7s} {'-':>8s} {'-':>7s} {'-':>14s}  FAILED: {e}")
              import time; time.sleep(m.PACE)
          print()
          print(f"RESULT: {ok} fully populated, {fail} with problems, out of {len(sample)}")
          PY
