name: verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check calendar host and pagination param
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: |
          python - <<'PY'
          import os, requests
          s = requests.Session()
          s.headers.update({"APCA-API-KEY-ID": os.environ["ALPACA_KEY"],
                            "APCA-API-SECRET-KEY": os.environ["ALPACA_SECRET"],
                            "accept": "application/json"})

          print("=== 1. calendar endpoint on paper-api ===")
          for day, label in [("2026-09-04","Fri - trading day"),
                             ("2026-09-05","Sat - weekend"),
                             ("2026-09-07","Mon - LABOR DAY"),
                             ("2026-09-08","Tue - trading day")]:
              r = s.get("https://paper-api.alpaca.markets/v2/calendar",
                        params={"start": day, "end": day}, timeout=25)
              j = r.json() if r.ok else None
              n = len(j) if isinstance(j, list) else "ERR"
              print(f"  {day} ({label:18s}) HTTP {r.status_code}  entries={n}  -> "
                    f"{'TRADING DAY' if n==1 else 'CLOSED' if n==0 else r.text[:120]}")

          print()
          print("=== 2. options pagination: is the request param 'page_token'? ===")
          base = "https://data.alpaca.markets/v1beta1/options/snapshots/SPY"
          p = {"feed":"indicative","type":"call","limit":2,
               "expiration_date_gte":"2026-09-26","expiration_date_lte":"2026-10-20",
               "strike_price_gte":700,"strike_price_lte":840}
          r1 = s.get(base, params=p, timeout=25); j1 = r1.json()
          k1 = sorted(j1.get("snapshots", {})); tok = j1.get("next_page_token")
          print(f"  page 1: HTTP {r1.status_code} contracts={k1} token={tok!r}")
          r2 = s.get(base, params={**p, "page_token": tok}, timeout=25); j2 = r2.json()
          k2 = sorted(j2.get("snapshots", {}))
          print(f"  page 2: HTTP {r2.status_code} contracts={k2}")
          print(f"  RESULT: {'page_token WORKS - page 2 is different' if k2 and k2 != k1 else 'PAGE_TOKEN DID NOT ADVANCE - do not ship pagination'}")

          print()
          print("=== 3. how many contracts does the real +/-8% window hold for SPY? ===")
          spot = 770.18
          pr = {"feed":"indicative","type":"call","limit":1000,
                "expiration_date_gte":"2026-09-29","expiration_date_lte":"2026-10-23",
                "strike_price_gte":round(spot*0.92,2),"strike_price_lte":round(spot*1.08,2)}
          total, pages, tk = 0, 0, None
          while pages < 10:
              if tk: pr["page_token"] = tk
              rr = s.get(base, params=pr, timeout=25); jj = rr.json()
              total += len(jj.get("snapshots", {})); pages += 1
              tk = jj.get("next_page_token")
              if not tk: break
          print(f"  SPY: {total} contracts across {pages} page(s) -> "
                f"{'SINGLE PAGE, cap was never a live risk' if pages==1 else 'MULTI-PAGE - the old code was truncating'}")
          PY
