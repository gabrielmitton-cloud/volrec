name: record
on:
  schedule:
    # 14:47 UTC. Three constraints pin this down, and cron cannot see any of
    # them, so they are written out here and enforced by pressure_test.py:
    #
    #  1. GitHub delays scheduled runs under load. Measured over six days at the
    #     old 15:30 slot the delay ran 3h06m to 4h24m, so the snapshot landed
    #     18:36-19:54 and on 14 Sep arrived SIX MINUTES before the close. A
    #     snapshot that lands after the close is not a late snapshot, it is a
    #     different measurement wearing the same label.
    #  2. Cron is UTC and the US session is not. Under DST the market runs
    #     13:30-20:00 UTC; from 1 November it runs 14:30-21:00. A cron chosen
    #     against the summer session alone fires BEFORE the November open.
    #  3. The top and quarters of the hour are where GitHub's queue is deepest.
    #
    # Together: the cron must be at or after 14:30 (the later of the two opens)
    # and at or before 15:06 (the earlier close, 20:00, minus the worst delay
    # seen, minus 30 minutes). 14:47 sits inside that window with 49 minutes of
    # headroom to the summer close and 17 minutes past the winter open, and is
    # not on a quarter hour.
    - cron: "47 14 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python record.py
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - run: |
          git config user.name "recorder"
          git config user.email "recorder@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "snapshot $(date +%F)"
          # Any other push to main in the same minute (surface.yml, or a hand
          # commit - 15 Oct 2026 lost the first snapshot this way) rejects a
          # plain push. Rebase and retry, as surface.yml does: data/ files are
          # touched only by the recorders, so the rebase resolves cleanly.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 10
          done
          exit 1
