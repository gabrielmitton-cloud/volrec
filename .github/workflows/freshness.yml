name: freshness
on:
  schedule:
    - cron: "0 20 * * *"      # daily, after the recorders land even at the
                              # worst delay yet seen (19:11-19:21 UTC from the
                              # 14:47/14:57 crons).
                              # Deliberately BEFORE panel_health's
                              # SURFACE_LANDED_HOUR_UTC, so this slot reads the
                              # ATM panel and holds judgment on the surface.
    - cron: "0 23 * * *"      # daily, long after any plausible delay. This is
                              # the one that can fail on the surface, so a
                              # green-but-empty surface run is caught the same
                              # day rather than the next.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # No pip step on purpose. panel_health.py uses only the standard library,
      # so this job cannot break because of a dependency it never needed.
      - name: Fail loudly if either panel has gone stale or empty
        run: python tools/panel_health.py
      # healthchecks.io dead man's switch (25 Sep 2026): a ping on success only, so a run
      # that never happens - GitHub dropping or disabling schedules - emails Gabriel from
      # OUTSIDE GitHub. It can never fail this job: curl's result is ignored.
      - name: Ping healthchecks.io
        if: success()
        env:
          HC: ${{ secrets.HC_RECORDERS }}
        run: |
          if [ -n "$HC" ]; then curl -fsS -m 10 --retry 3 -o /dev/null "$HC" && echo "pinged" || echo "ping failed (ignored)"; else echo "no ping URL set"; fi
