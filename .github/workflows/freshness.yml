name: freshness
on:
  schedule:
    - cron: "0 20 * * *"      # daily, after the recorders land even at the
                              # worst delay yet seen (19:11-19:21 UTC from the
                              # 14:47/14:57 crons).
                              # Deliberately BEFORE panel_health's
                              # SURFACE_LANDED_HOUR_UTC, so this slot reads the
                              # ATM panel and holds judgment on the surface.
    - cron: "0 23 * * *"      # daily, long after any plausible delay. This is
                              # the one that can fail on the surface, so a
                              # green-but-empty surface run is caught the same
                              # day rather than the next.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # No pip step on purpose. panel_health.py uses only the standard library,
      # so this job cannot break because of a dependency it never needed.
      - name: Fail loudly if either panel has gone stale or empty
        run: |
          set -o pipefail
          python tools/panel_health.py | tee health.txt
      # Pushover (15 Oct 2026): a lost day is YELLOW - after the close nothing can save it, so it
      # must not wake anyone; the guard (guard.yml) owns the same-day RED. Only the 23:00 slot
      # alerts, so one lost day is one message; the 20:00 slot still emails through its red X.
      - name: Tell Gabriel's phone (late slot only)
        if: failure() && (github.event.schedule == '0 23 * * *' || github.event_name == 'workflow_dispatch')
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          MSG=$(grep -E "FAIL|missed" health.txt 2>/dev/null | head -6)
          python tools/alert.py --level yellow --title "a recorded day is missing or broken" \
            --message "${MSG:-panel_health crashed - open the run}. A missed day cannot be re-recorded after the close; tell Claude." \
            --url "$RUN_URL" || true
      # healthchecks.io dead man's switch (25 Sep 2026): a ping on success only, so a run
      # that never happens - GitHub dropping or disabling schedules - emails Gabriel from
      # OUTSIDE GitHub. It can never fail this job: curl's result is ignored.
      - name: Ping healthchecks.io
        if: success()
        env:
          HC: ${{ secrets.HC_RECORDERS }}
        run: |
          if [ -n "$HC" ]; then curl -fsS -m 10 --retry 3 -o /dev/null "$HC" && echo "pinged" || echo "ping failed (ignored)"; else echo "no ping URL set"; fi
