name: freshness
on:
  schedule:
    - cron: "0 17 * * *"      # daily, 90 min after the recorder
    - cron: "0 21 * * *"      # daily, after the surface job lands (~18:45 UTC).
                              # The 17:00 slot is too early to judge the surface
                              # panel, so without this one a green-but-empty
                              # surface run is not caught until the next day.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # No pip step on purpose. panel_health.py uses only the standard library,
      # so this job cannot break because of a dependency it never needed.
      - name: Fail loudly if either panel has gone stale or empty
        run: python tools/panel_health.py
