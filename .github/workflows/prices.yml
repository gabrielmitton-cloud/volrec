name: prices
# TEMPORARY. Exercises analyze.py's fetch_closes() against the live Alpaca bars
# endpoint - the last untested link before the October analysis. Delete after.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Price path
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: |
          python - <<'PY'
          import atexit, csv, hashlib, os, sys
          from datetime import date, timedelta
          from pathlib import Path
          import analyze as A

          _S = os.environ.get("GITHUB_STEP_SUMMARY")
          if _S:
              _sf = open(_S, "a", buffering=1); _sf.write("```text\n")
              class _T:
                  def __init__(s,*f): s.f=f
                  def write(s,x):
                      for g in s.f: g.write(x)
                      return len(x)
                  def flush(s):
                      for g in s.f: g.flush()
              sys.stdout=_T(sys.__stdout__,_sf)
              @atexit.register
              def _c():
                  try: _sf.write("\n```\n"); _sf.flush()
                  except Exception: pass

          FAILS=[]
          REAL=Path("data/iv_history.csv"); MD5=hashlib.md5(REAL.read_bytes()).hexdigest()
          A.PRICE_CACHE = Path("/tmp/prices.json")          # never write inside data/
          print(f"REAL md5 {MD5}\ncache -> {A.PRICE_CACHE}\n")

          SYMS=["SPY","AAPL","KO","TLT","MSTR","HYG","XLC","XLRE"]
          end=date.today(); start=end-timedelta(days=200)
          print("="*72); print("A. fetch_closes() against the live Alpaca bars endpoint"); print("="*72)
          try:
              closes=A.fetch_closes(SYMS,start,end)
          except Exception as e:
              print(f"RAISED {type(e).__name__}: {e}"); FAILS.append(f"fetch_closes raised: {e}"); closes={}
          for s in SYMS:
              d=closes.get(s,{}); n=len([k for k in d if k!="_end"])
              ks=sorted(k for k in d if k!="_end")
              print(f"  {s:6s} {n:4d} daily closes  {ks[0] if ks else '--'} -> {ks[-1] if ks else '--'}")
              if n<100: FAILS.append(f"{s}: only {n} closes over ~200 days")

          print("\n"+"="*72); print("B. is adjustment=all actually applied?"); print("="*72)
          print("  An unadjusted split or dividend inside a forward window becomes a huge")
          print("  fake return and destroys realized vol. Compare raw vs adjusted:")
          import requests
          s=requests.Session()
          s.headers.update({"APCA-API-KEY-ID":os.environ["ALPACA_KEY"],
                            "APCA-API-SECRET-KEY":os.environ["ALPACA_SECRET"],"accept":"application/json"})
          def series(sym,adj):
              r=s.get(f"{A.DATA_URL}/v2/stocks/bars",params=dict(symbols=sym,timeframe="1Day",
                  feed="iex",start=start.isoformat(),end=end.isoformat(),limit=10000,adjustment=adj),timeout=30)
              r.raise_for_status()
              return {b["t"][:10]:b["c"] for b in (r.json().get("bars") or {}).get(sym,[])}
          for sym in ("KO","AAPL"):
              raw,adj=series(sym,"raw"),series(sym,"all")
              common=sorted(set(raw)&set(adj))
              diff=[k for k in common if abs(raw[k]-adj[k])>1e-6]
              print(f"  {sym:5s} {len(common)} common days, {len(diff)} differ between raw and adjusted"
                    f"{'  <- adjustment IS being applied' if diff else '  <- identical'}")

          print("\n"+"="*72); print("C. realized vol on a COMPLETED historical window (real bars)"); print("="*72)
          for sym in ("SPY","AAPL","MSTR","TLT"):
              d=closes.get(sym,{}); ks=sorted(k for k in d if k!="_end")
              if len(ks)<40: continue
              win=[d[k] for k in ks[-30:]]
              rv=A.realized_vol(A.log_returns(win))
              ok = rv is not None and 0.02 < rv < 2.0
              print(f"  {sym:6s} realized vol over the last 30 sessions: {rv*100:6.2f}%  "
                    f"{'plausible' if ok else '*** IMPLAUSIBLE ***'}")
              if not ok: FAILS.append(f"{sym} realized vol {rv}")

          print("\n"+"="*72); print("D. build_panel() on the REAL rows with REAL prices"); print("="*72)
          rows=A.load_rows()
          allc=A.fetch_closes(sorted({r['symbol'] for r in rows}),start,end)
          panel,dropped=A.build_panel(rows,allc)
          print(f"  kept {len(panel)} of {len(rows)};  dropped {dict((k,v) for k,v in dropped.items() if v)}")
          print("  Expected: every row dropped as 'window incomplete' - the 4 Sep snapshots")
          print("  look forward to 2-16 Oct, which has not happened. That is the correct")
          print("  behaviour and proves partial windows are never annualised.")
          if panel: FAILS.append(f"{len(panel)} rows kept but no forward window can be complete yet")
          if dropped.get("window incomplete",0) != len(rows):
              FAILS.append(f"expected all {len(rows)} dropped as incomplete, got {dropped}")

          print("\n"+"="*72); print("E. cache round-trip"); print("="*72)
          sz=A.PRICE_CACHE.stat().st_size if A.PRICE_CACHE.exists() else 0
          import json
          c2=json.loads(A.PRICE_CACHE.read_text()) if sz else {}
          print(f"  cache {sz/1024:.0f} KB, {len(c2)} symbols")
          if sz==0: FAILS.append("price cache not written")

          print("\n"+"="*72)
          after=hashlib.md5(REAL.read_bytes()).hexdigest()
          print(f"  real md5 before {MD5}\n  real md5 after  {after}")
          if after!=MD5: FAILS.append("REAL DATASET MODIFIED")
          else: print("  real dataset UNCHANGED")
          assert after==MD5

          print("\n"+"="*72)
          if FAILS:
              print("FAILURES:"); [print("  -",f) for f in FAILS]; sys.exit(1)
          print("ALL PRICE-PATH CHECKS PASSED")
          PY
