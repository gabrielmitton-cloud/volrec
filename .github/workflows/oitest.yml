name: oitest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oitest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Surface with open interest, then the model-free estimate
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: |
          python - <<'PY' 2>&1 | tee /tmp/o.txt
          import csv, time
          from datetime import date, timedelta
          from pathlib import Path
          import record as R, surface, modelfree
          today = date.today()
          while today.weekday() >= 5:
              today -= timedelta(days=1)
          s = R.session()
          spots = R.spot_prices(s, surface.SURFACE)
          rows = []
          for sym in surface.SURFACE:
              try:
                  r = surface.rows_for(s, sym, spots[sym], today)
                  rows += r
                  oi = [int(x["open_interest"]) for x in r
                        if str(x["open_interest"]).strip().isdigit()]
                  vol = [int(x["volume"]) for x in r if str(x["volume"]).strip().isdigit()]
                  dts = sorted({x["open_interest_date"] for x in r if x["open_interest_date"]})
                  print(f"  {sym:5s} {len(r):>4d} rows | oi on {len(oi):>4d} "
                        f"(tot {sum(oi):>10,}) | vol tot {sum(vol):>8,} | "
                        f"oi_date {dts[:1]}")
              except Exception as e:
                  print(f"  {sym:5s} FAILED {type(e).__name__}: {e}")
              time.sleep(0.8)
          out = Path("/tmp/surface.csv")
          with out.open("w", newline="") as f:
              w = csv.DictWriter(f, fieldnames=surface.FIELDS)
              w.writeheader(); w.writerows(rows)
          print(f"\nrows/day {len(rows)}  bytes {out.stat().st_size:,}  "
                f"per year {out.stat().st_size*252/1e6:.0f} MB\n")
          modelfree.SURF = out
          modelfree.main()
          PY
          cat /tmp/o.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Assert nothing written to data/
        run: git diff --exit-code -- data/ && echo "data/ clean"
