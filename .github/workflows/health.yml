name: health
# The whole daily check - panel health, the pressure test, the registered H3 reading,
# the H5e tally - on the runner, with the report published on the run page.
#
# Why a SEPARATE workflow (OPS-AGENT.md item 3, built 23 Sep 2026): the pressure test
# crashed for two days (21-23 Sep) and nothing noticed, because only freshness.yml
# runs in CI and it runs panel_health alone. freshness.yml deliberately installs
# nothing so the missed-day alarm can never break on a dependency; that stays true.
# This job needs requests and pyyaml, so it lives here, where breaking it cannot
# silence the alarm that matters most.
#
# It NEVER commits. Two recorders already push to main every weekday; a third
# committer would only add push races against the irreplaceable data.
on:
  schedule:
    - cron: "37 23 * * 1-5"   # weekdays, after freshness's late slot; off the quarter hours
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install what the pressure test imports
        run: pip install requests pyyaml
      - name: Daily check (exits non-zero, which emails, on any FAIL or crash)
        run: |
          set -o pipefail
          python tools/daily.py --no-pull | tee report.txt
      # healthchecks.io dead man's switch (25 Sep 2026): a ping on success only, so a night
      # on which this never runs is reported by email from outside GitHub. It cannot fail
      # this job, and it commits nothing.
      - name: Ping healthchecks.io
        if: success()
        env:
          HC: ${{ secrets.HC_HEALTH }}
        run: |
          if [ -n "$HC" ]; then curl -fsS -m 10 --retry 3 -o /dev/null "$HC" && echo "pinged" || echo "ping failed (ignored)"; else echo "no ping URL set"; fi
      # Pushover (15 Oct 2026, Gabriel): one quiet GREEN line on a clean day - its ARRIVAL proves the
      # alert pipe works, so a weekday with no green means look. LOOK AT is YELLOW; a FAIL or crash
      # is YELLOW with the failing lines. Never RED: nothing here can still be saved today.
      - name: Tell Gabriel's phone
        if: always()
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = success ] && grep -q "ALL CLEAR" report.txt 2>/dev/null; then
            MSG=$(grep -E "landed|RESULT|mean \|gap\|" report.txt | sed 's/^ *//; s/^INFO  //' | head -5)
            python tools/alert.py --level green --title "all clear" --message "$MSG" --url "$RUN_URL" || true
          else
            MSG=$(grep -E "FAIL|LOOK AT|Traceback|Error" report.txt 2>/dev/null | head -6)
            python tools/alert.py --level yellow --title "the daily check needs a look" \
              --message "${MSG:-the daily check crashed before writing a report}" --url "$RUN_URL" || true
          fi
      - name: Publish the report on the run page
        if: always()
        run: |
          { echo '```'; cat report.txt 2>/dev/null || echo "no report was written"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
